version: "3.8"

services:
  mysql:
    image: docker.io/library/mysql:latest
    container_name: mysql-studentservice
    environment:
      MYSQL_ROOT_PASSWORD: password
      # MYSQL_DATABASE: my_database
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: